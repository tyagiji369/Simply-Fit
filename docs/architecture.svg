<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2D6A4F"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#F7F5F1"/>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-style="italic" fill="#1A1A1A">Simply-Fit <tspan font-style="normal" fill="#2D6A4F">— system architecture</tspan></text>

  <!-- ══════════ BAND 1: TRAINING (offline) ══════════ -->
  <rect x="30" y="62" width="900" height="140" rx="10" fill="#FFFFFF" stroke="#E8E4DC"/>
  <text x="48" y="88" font-size="13" fill="#B8B0A8" font-family="Helvetica, Arial, sans-serif" letter-spacing="2">1 · TRAINING (OFFLINE, SEE NOTEBOOKS 01–05)</text>

  <rect x="60" y="104" width="170" height="72" rx="6" fill="#F7F5F1" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="145" y="132" text-anchor="middle" font-size="13" fill="#1A1A1A">CDC NHANES</text>
  <text x="145" y="150" text-anchor="middle" font-size="11" fill="#6B6459">5,434 real adults</text>
  <text x="145" y="164" text-anchor="middle" font-size="10" fill="#6B6459" font-family="Helvetica, Arial, sans-serif">data/public/nhanes_adults.csv</text>

  <line x1="230" y1="140" x2="272" y2="140" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="274" y="104" width="180" height="72" rx="6" fill="#F7F5F1" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="364" y="126" text-anchor="middle" font-size="13" fill="#1A1A1A">Synthetic generator</text>
  <text x="364" y="143" text-anchor="middle" font-size="11" fill="#6B6459">demographics fitted</text>
  <text x="364" y="157" text-anchor="middle" font-size="11" fill="#6B6459">to NHANES + physiology</text>
  <text x="364" y="171" text-anchor="middle" font-size="10" fill="#6B6459" font-family="Helvetica, Arial, sans-serif">src/data_generator.py</text>

  <line x1="454" y1="140" x2="496" y2="140" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="498" y="104" width="170" height="72" rx="6" fill="#F7F5F1" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="583" y="126" text-anchor="middle" font-size="13" fill="#1A1A1A">LSTM training</text>
  <text x="583" y="143" text-anchor="middle" font-size="11" fill="#6B6459">walk-forward split,</text>
  <text x="583" y="157" text-anchor="middle" font-size="11" fill="#6B6459">no target leakage</text>
  <text x="583" y="171" text-anchor="middle" font-size="10" fill="#6B6459" font-family="Helvetica, Arial, sans-serif">src/lstm_forecaster.py</text>

  <line x1="668" y1="140" x2="710" y2="140" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="712" y="104" width="190" height="72" rx="6" fill="#EAF2ED" stroke="#2D6A4F" stroke-width="1.2"/>
  <text x="807" y="126" text-anchor="middle" font-size="13" fill="#1A1A1A">Model + honest eval</text>
  <text x="807" y="143" text-anchor="middle" font-size="11" fill="#2D6A4F">LSTM vs linear vs</text>
  <text x="807" y="157" text-anchor="middle" font-size="11" fill="#2D6A4F">persistence (MAE)</text>
  <text x="807" y="171" text-anchor="middle" font-size="10" fill="#6B6459" font-family="Helvetica, Arial, sans-serif">results/model_evaluation.json</text>

  <!-- ══════════ BAND 2: RUNTIME PIPELINE ══════════ -->
  <rect x="30" y="222" width="900" height="150" rx="10" fill="#FFFFFF" stroke="#E8E4DC"/>
  <text x="48" y="248" font-size="13" fill="#B8B0A8" font-family="Helvetica, Arial, sans-serif" letter-spacing="2">2 · DAILY PIPELINE (SRC/ML_ENGINE.PY)</text>

  <rect x="60" y="264" width="150" height="80" rx="6" fill="#F7F5F1" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="135" y="290" text-anchor="middle" font-size="13" fill="#1A1A1A">Daily weight log</text>
  <text x="135" y="308" text-anchor="middle" font-size="11" fill="#6B6459">one number per</text>
  <text x="135" y="322" text-anchor="middle" font-size="11" fill="#6B6459">morning, no food log</text>

  <line x1="210" y1="304" x2="252" y2="304" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="254" y="264" width="160" height="80" rx="6" fill="#F7F5F1" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="334" y="290" text-anchor="middle" font-size="13" fill="#1A1A1A">EWMA smoothing</text>
  <text x="334" y="308" text-anchor="middle" font-size="11" fill="#6B6459">fat trend vs daily</text>
  <text x="334" y="322" text-anchor="middle" font-size="11" fill="#6B6459">water noise (span 7)</text>

  <line x1="414" y1="304" x2="456" y2="304" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="458" y="264" width="170" height="80" rx="6" fill="#F7F5F1" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="543" y="290" text-anchor="middle" font-size="13" fill="#1A1A1A">Isolation Forest</text>
  <text x="543" y="308" text-anchor="middle" font-size="11" fill="#6B6459">flags water spikes;</text>
  <text x="543" y="322" text-anchor="middle" font-size="11" fill="#6B6459">replaced by trend value</text>

  <line x1="628" y1="304" x2="670" y2="304" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="672" y="264" width="230" height="80" rx="6" fill="#EAF2ED" stroke="#2D6A4F" stroke-width="1.2"/>
  <text x="787" y="288" text-anchor="middle" font-size="13" fill="#1A1A1A">Backward calorie inference</text>
  <text x="787" y="306" text-anchor="middle" font-size="11" fill="#2D6A4F">regression on trend × 7,700</text>
  <text x="787" y="320" text-anchor="middle" font-size="11" fill="#2D6A4F">→ kcal/day ± 95% CI</text>
  <text x="787" y="334" text-anchor="middle" font-size="10" fill="#6B6459" font-family="Helvetica, Arial, sans-serif">median error 8 kcal/day vs ground truth</text>

  <!-- ══════════ BAND 3: COACH ══════════ -->
  <rect x="30" y="392" width="900" height="170" rx="10" fill="#FFFFFF" stroke="#E8E4DC"/>
  <text x="48" y="418" font-size="13" fill="#B8B0A8" font-family="Helvetica, Arial, sans-serif" letter-spacing="2">3 · AI COACH (SRC/AGENT_COACH.PY — INTENT-ROUTED TOOL CALLING)</text>

  <rect x="60" y="434" width="140" height="72" rx="6" fill="#F7F5F1" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="130" y="460" text-anchor="middle" font-size="13" fill="#1A1A1A">User question</text>
  <text x="130" y="478" text-anchor="middle" font-size="11" fill="#6B6459">free-form text</text>
  <text x="130" y="492" text-anchor="middle" font-size="11" fill="#6B6459">(chat panel)</text>

  <line x1="200" y1="470" x2="242" y2="470" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="244" y="434" width="150" height="72" rx="6" fill="#F7F5F1" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="319" y="460" text-anchor="middle" font-size="13" fill="#1A1A1A">Intent router</text>
  <text x="319" y="478" text-anchor="middle" font-size="11" fill="#6B6459">keyword scoring →</text>
  <text x="319" y="492" text-anchor="middle" font-size="11" fill="#6B6459">one of six intents</text>

  <line x1="394" y1="470" x2="436" y2="470" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="438" y="434" width="230" height="72" rx="6" fill="#F7F5F1" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="553" y="456" text-anchor="middle" font-size="13" fill="#1A1A1A">Deterministic tools</text>
  <text x="553" y="473" text-anchor="middle" font-size="11" fill="#6B6459">calorie inference · 7-day forecast</text>
  <text x="553" y="487" text-anchor="middle" font-size="11" fill="#6B6459">TF-IDF guideline retrieval · plateau</text>
  <text x="553" y="501" text-anchor="middle" font-size="10" fill="#6B6459" font-family="Helvetica, Arial, sans-serif">fixed pipeline — LLM never picks tools</text>

  <line x1="668" y1="470" x2="710" y2="470" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="712" y="434" width="190" height="72" rx="6" fill="#EAF2ED" stroke="#2D6A4F" stroke-width="1.2"/>
  <text x="807" y="458" text-anchor="middle" font-size="13" fill="#1A1A1A">Response synthesis</text>
  <text x="807" y="476" text-anchor="middle" font-size="11" fill="#2D6A4F">Gemini API if key present,</text>
  <text x="807" y="490" text-anchor="middle" font-size="11" fill="#2D6A4F">else grounded templates</text>

  <!-- cross-band arrows -->
  <path d="M 583 176 L 583 264" stroke="#2D6A4F" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrg)"/>
  <text x="594" y="222" font-size="10" fill="#2D6A4F" font-family="Helvetica, Arial, sans-serif">model used at inference (linear fallback)</text>

  <path d="M 807 176 L 807 264" stroke="#2D6A4F" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
  <text x="600" y="530" font-size="10" fill="#6B6459" font-family="Helvetica, Arial, sans-serif"></text>

  <text x="480" y="586" text-anchor="middle" font-size="11" fill="#B8B0A8" font-family="Helvetica, Arial, sans-serif">Not a substitute for professional medical advice · MIT License</text>
</svg>
